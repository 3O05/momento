name: Compilar APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew testDebugUnitTest

      - name: Preparar firma (desde Secrets)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > momento-release.jks

      - name: Compilar APK firmada
        env:
          MOMENTO_KEYSTORE: momento-release.jks
          MOMENTO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MOMENTO_KEY_ALIAS: momento
          MOMENTO_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: momento-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
